name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: formcraft_test
          POSTGRES_PASSWORD: disposable_ci_password
          POSTGRES_DB: formcraft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U formcraft_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      FORMCRAFT_TEST_DATABASE_URL: postgresql://formcraft_test:disposable_ci_password@localhost:5432/formcraft_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
      - run: node --check web/static/builder.js
      - run: node --check web/static/form.js
      - run: node --check web/static/ai-builder.js
      - run: node --check web/static/voice.js
      - run: uv run python scripts/check_release.py
      - run: git diff --check
