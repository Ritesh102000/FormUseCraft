# Source-available with required attribution; see LICENSE.
# Personal and commercial use is allowed. Every hosted form must retain the small
# "Powered by catapultaiwork" link. There is no builder setting to hide it.
# People controlling the source can edit it, but the license requires this credit.
# This is a custom attribution license, not standard MIT or OSI-approved open source.

[project]
name = "formcraft"
version = "0.1.0"
description = "Self-hosted form builder with optional Google Sheets sync by catapultaiwork"
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116.0",
    "pydantic>=2.9.0",
    "uvicorn[standard]>=0.35.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2.0",
    "argon2-cffi>=23.1.0",
    "python-dotenv>=1.1.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "google-auth>=2.35.0",
    "google-auth-oauthlib>=1.2.1",
    "google-api-python-client>=2.150.0",
    "xlsxwriter>=3.2.9",
    "cryptography>=44.0.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formcraft"]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pgserver>=0.1.4",
    "pytest>=8.0.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]
